<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asheville Trip Guide - Nov 28 - Dec 1</title>
    
    <!-- Leaflet CSS only in head -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a1a; color: #e0e0e0; overflow-x: hidden;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; padding: 20px; text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .header h1 { font-size: 2em; margin-bottom: 5px; }
        .header p { font-size: 1.1em; opacity: 0.9; }
        .container { display: flex; height: calc(100vh - 120px); min-height: 500px; }
        .sidebar { width: 400px; background: #242424; overflow-y: auto; border-right: 2px solid #333; flex-shrink: 0; }
        .filters { padding: 20px; background: #2a2a2a; border-bottom: 2px solid #333; position: sticky; top: 0; z-index: 100; }
        .filter-btn { display: inline-block; padding: 8px 16px; margin: 4px; background: #3a3a3a; border: 2px solid #555;
                      border-radius: 20px; cursor: pointer; transition: all 0.3s; font-size: 0.9em; color: #e0e0e0; }
        .filter-btn:hover { background: #4a4a4a; transform: translateY(-2px); }
        .filter-btn.active { background: #667eea; border-color: #667eea; color: white; font-weight: bold; }
        .place-card { padding: 15px 20px; border-bottom: 1px solid #333; cursor: pointer; transition: background 0.2s; }
        .place-card:hover { background: #2a2a2a; }
        .place-card.selected { background: #3a3a3a; border-left: 4px solid #667eea; }
        .place-name { font-size: 1.1em; font-weight: bold; color: #fff; margin-bottom: 5px; }
        .place-category { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 0.75em;
                          font-weight: bold; margin-bottom: 8px; text-transform: uppercase; }
        .cat-breakfast { background: #ff9800; color: white; }
        .cat-lunch { background: #4caf50; color: white; }
        .cat-dinner { background: #f44336; color: white; }
        .cat-brewery { background: #ffc107; color: #333; }
        .cat-shop, .cat-attraction { background: #9c27b0; color: white; }
        .place-description { font-size: 0.9em; color: #aaa; margin-bottom: 8px; line-height: 1.4; }
        .place-distance { font-size: 0.85em; color: #667eea; font-weight: bold; }
        #map { flex: 1; background: #1a1a1a; min-width: 0; }
        .leaflet-container { background: #1a1a1a; }
        .legend { background: #2a2a2a; padding: 15px; margin: 20px; border-radius: 8px; border: 2px solid #333; }
        .legend-title { font-weight: bold; margin-bottom: 10px; color: #fff; font-size: 1.1em; }
        .legend-item { display: flex; align-items: center; margin: 8px 0; font-size: 0.9em; }
        .legend-icon { width: 20px; height: 20px; border-radius: 50%; margin-right: 10px; border: 2px solid white; flex-shrink: 0; }
        @media (max-width: 768px) {
            .container { flex-direction: column; height: auto; }
            .sidebar { width: 100%; height: 50vh; border-right: none; border-bottom: 2px solid #333; }
            #map { height: 50vh; width: 100%; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Asheville Adventure Guide</h1>
        <p>Nov 28 - Dec 1, 2024 | Staying in Candler, NC</p>
    </div>
   
    <div class="container">
        <div class="sidebar">
            <div class="filters">
                <div class="filter-btn active" data-filter="all">All Places</div>
                <div class="filter-btn" data-filter="breakfast">Breakfast</div>
                <div class="filter-btn" data-filter="lunch">Lunch</div>
                <div class="filter-btn" data-filter="dinner">Dinner</div>
                <div class="filter-btn" data-filter="brewery">Breweries</div>
                <div class="filter-btn" data-filter="shop">Shops</div>
            </div>
            <div id="placesList"></div>
            <div class="legend">
                <div class="legend-title">Map Legend</div>
                <div class="legend-item"><div class="legend-icon" style="background:#ff9800;"></div><span>Breakfast Spots</span></div>
                <div class="legend-item"><div class="legend-icon" style="background:#4caf50;"></div><span>Lunch Spots</span></div>
                <div class="legend-item"><div class="legend-icon" style="background:#f44336;"></div><span>Dinner Spots</span></div>
                <div class="legend-item"><div class="legend-icon" style="background:#ffc107;"></div><span>Breweries</span></div>
                <div class="legend-item"><div class="legend-icon" style="background:#9c27b0;"></div><span>Unique Shops</span></div>
                <div class="legend-item"><div class="legend-icon" style="background:#2196f3; width:24px; border-radius:4px;"></div><span>Your Airbnb</span></div>
            </div>
        </div>
        <div id="map"></div>
    </div>

    <!-- Leaflet JS moved here — this is the fix -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <script>
        const airbnb = { lat: 35.5360973, lng: -82.6927363, name: "Your Airbnb", address: "805 Case Cove Rd, Candler, NC" };

        const places = [ /* ← your giant places array stays 100% unchanged → */ 
            { name: "Biscuit Head", category: "breakfast", lat: 35.5778943, lng: -82.5927613, description: "Cathead biscuits, creative gravy flights, Southern brunch classics — great for weekend brunch lines.", distance: "~22 min" },
            { name: "Sunny Point Café", category: "breakfast", lat: 35.5785850, lng: -82.5888464, description: "West Asheville farm-to-table cafe. Stellar huevos rancheros and fresh, seasonal breakfast plates.", distance: "~21 min" },
            /* ... all your other places exactly as you had them ... */
            { name: "North Carolina Arboretum", category: "attraction", lat: 35.530400, lng: -82.520700, description: "Large public gardens and trails just south of Asheville — gardens, exhibits and seasonal displays.", distance: "~20 min" }
        ];

        const categoryColors = { breakfast: '#ff9800', lunch: '#4caf50', dinner: '#f44336', brewery: '#ffc107', shop: '#9c27b0', attraction: '#9c27b0' };

        let map, markers = [], currentFilter = 'all';

        function initMap() {
            map = L.map('map').setView([airbnb.lat, airbnb.lng], 11);  // centered on your Airbnb

            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; OpenStreetMap &copy; CARTO', maxZoom: 19
            }).addTo(map);

            // Airbnb marker
            const airbnbIcon = L.divIcon({
                html: '<div style="background:#2196f3;width:30px;height:30px;border-radius:4px;border:3px solid white;box-shadow:0 2px 8px rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;font-weight:bold;color:white;font-size:16px;">Home</div>',
                className: '', iconSize: [30,30], iconAnchor: [15,15]
            });
            L.marker([airbnb.lat, airbnb.lng], {icon: airbnbIcon})
                .addTo(map)
                .bindPopup(`<div class="popup-title">Home ${airbnb.name}</div><div class="popup-description">${airbnb.address}</div>`);

            // All other markers
            places.forEach(place => {
                const color = categoryColors[place.category] || '#cccccc';
                const icon = L.divIcon({
                    html: `<div style="background:${color};width:24px;height:24px;border-radius:50%;border:3px solid white;box-shadow:0 2px 6px rgba(0,0,0,0.5);"></div>`,
                    className: '', iconSize: [24,24], iconAnchor: [12,12]
                });
                const marker = L.marker([place.lat, place.lng], {icon})
                    .bindPopup(`
                        <div class="popup-title">${place.name}</div>
                        <div class="place-category cat-${place.category}">${place.category}</div>
                        <div class="popup-description">${place.description}</div>
                        <div class="popup-distance">Car ${place.distance} from Airbnb</div>
                    `);
                marker.placeData = place;
                markers.push(marker);
                marker.addTo(map);
            });
        }

        function renderPlacesList() {
            const list = document.getElementById('placesList');
            list.innerHTML = '';
            const filtered = currentFilter === 'all' ? places : places.filter(p => p.category === currentFilter);
            filtered.forEach(place => {
                const card = document.createElement('div');
                card.className = 'place-card';
                card.innerHTML = `
                    <div class="place-name">${place.name}</div>
                    <div class="place-category cat-${place.category}">${place.category}</div>
                    <div class="place-description">${place.description}</div>
                    <div class="place-distance">Car ${place.distance} from your Airbnb</div>
                `;
                card.addEventListener('click', () => {
                    document.querySelectorAll('.place-card').forEach(c => c.classList.remove('selected'));
                    card.classList.add('selected');
                    const marker = markers.find(m => m.placeData.name === place.name);
                    if (marker) { map.setView([place.lat, place.lng], 15); marker.openPopup(); }
                });
                list.appendChild(card);
            });
        }

        function setupFilters() {
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentFilter = btn.dataset.filter;
                    markers.forEach(m => {
                        if (currentFilter === 'all' || m.placeData.category === currentFilter) m.addTo(map);
                        else map.removeLayer(m);
                    });
                    renderPlacesList();
                });
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            initMap();
            renderPlacesList();
            setupFilters();
        });
    </script>
</body>
</html>
