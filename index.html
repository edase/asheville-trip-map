        const categoryColors = {
            breakfast: '#ff9800',
            lunch: '#4caf50',
            dinner: '#f44336',
            brewery: '#ffc107',
            shop: '#9c27b0'
        };
        
        let map, markers = [], currentFilter = 'all';
        
        function initMap() {
            // Initialize map
            map = L.map('map', {
                zoomControl: true,
                scrollWheelZoom: true
            }).setView([35.5750, -82.5850], 12);
            
            // Add tile layer
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
                subdomains: 'abcd',
                maxZoom: 19
            }).addTo(map);
            
            // Add Airbnb marker
            const airbnbIcon = L.divIcon({
                html: '<div style="background: #2196f3; width: 30px; height: 30px; border-radius: 4px; border: 3px solid white; box-shadow: 0 2px 8px rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; font-weight: bold; color: white; font-size: 16px;">🏠</div>',
                className: '',
                iconSize: [30, 30],
                iconAnchor: [15, 15]
            });
            
            L.marker([airbnb.lat, airbnb.lng], { icon: airbnbIcon })
                .addTo(map)
                .bindPopup(`<div class="popup-title">🏠 ${airbnb.name}</div><div class="popup-description">${airbnb.address}</div>`);
            
            // Add place markers
            places.forEach(place => {
                const icon = L.divIcon({
                    html: `<div style="background: ${categoryColors[place.category]}; width: 24px; height: 24px; border-radius: 50%; border: 3px solid white; box-shadow: 0 2px 6px rgba(0,0,0,0.5);"></div>`,
                    className: '',
                    iconSize: [24, 24],
                    iconAnchor: [12, 12]
                });
                
                const marker = L.marker([place.lat, place.lng], { icon })
                    .bindPopup(`
                        <div class="popup-title">${place.name}</div>
                        <div class="place-category cat-${place.category}">${place.category}</div>
                        <div class="popup-description">${place.description}</div>
                        <div class="popup-distance">🚗 ${place.distance} from Airbnb</div>
                    `);
                
                marker.placeData = place;
                markers.push(marker);
                marker.addTo(map);
            });
        }
        
        function renderPlacesList() {
            const list = document.getElementById('placesList');
            list.innerHTML = '';
            
            const filtered = currentFilter === 'all' 
                ? places 
                : places.filter(p => p.category === currentFilter);
            
            filtered.forEach(place => {
                const card = document.createElement('div');
                card.className = 'place-card';
                card.innerHTML = `
                    <div class="place-name">${place.name}</div>
                    <div class="place-category cat-${place.category}">${place.category}</div>
                    <div class="place-description">${place.description}</div>
                    <div class="place-distance">🚗 ${place.distance} from your Airbnb</div>
                `;
                
                card.addEventListener('click', function() {
                    document.querySelectorAll('.place-card').forEach(c => c.classList.remove('selected'));
                    card.classList.add('selected');
                    
                    const marker = markers.find(m => m.placeData.name === place.name);
                    if (marker) {
                        map.setView([place.lat, place.lng], 15);
                        marker.openPopup();
                    }
                });
                
                list.appendChild(card);
            });
        }
        
        function setupFilters() {
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    
                    currentFilter = btn.dataset.filter;
                    
                    markers.forEach(marker => {
                        if (currentFilter === 'all' || marker.placeData.category === currentFilter) {
                            marker.addTo(map);
                        } else {
                            map.removeLayer(marker);
                        }
                    });
                    
                    renderPlacesList();
                });
            });
        }
        
        // Initialize everything when page loads
        document.addEventListener('DOMContentLoaded', function() {
            initMap();
            renderPlacesList();
            setupFilters();
        });
    </script>
